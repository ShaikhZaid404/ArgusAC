# ------------------------------------------------------------------------------
# 1. AI PROVIDER API KEYS
# ------------------------------------------------------------------------------
# Provide one or more keys. ArgusAC will automatically query available models,
# rank them for best throughput/latency, and failover smoothly if limits hit.

ai:
  # Groq Cloud API Key (Get free high-speed key at: https://console.groq.com)
  groq-api-key: ""

  # OpenRouter API Key (Get key at: https://openrouter.ai/keys)
  openrouter-api-key: ""

  # Google Gemini API Key (Get key at: https://aistudio.google.com/app/apikey)
  gemini-api-key: ""

# ------------------------------------------------------------------------------
# 2. DISCORD BOT CREDENTIALS
# ------------------------------------------------------------------------------
# Create an application at https://discord.com/developers/applications
# Enable 'Server Members' and 'Message Content' Gateway Intents under the Bot tab.
discord:
  # Bot Token (Paste the bot secret token here)
  bot-token: ""

  # Discord Server (Guild) ID
  # Paste your Discord Server ID here for INSTANT (0-second) Slash Command registration!
  # If left empty, slash commands register globally (which takes up to 1 hour on Discord).
  guild-id: ""

# ------------------------------------------------------------------------------
# 3. DATABASE CREDENTIALS (When using MySQL in config.yml)
# ------------------------------------------------------------------------------
database:
  mysql-password: ""
